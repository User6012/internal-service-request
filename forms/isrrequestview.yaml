elements:
- elements:
  - elements:
    - className: org.joget.apps.form.lib.IdGeneratorField
      properties:
        hidden: 'true'
        format: ????
        workflowVariable: ''
        envVariable: counter
        id: ref_id
        label: Ref Id
    - className: org.joget.apps.form.lib.CustomHTML
      properties:
        autoPopulate: ''
        id: field16
        label: Subject
        value: '##form.j_isr_request.ref_id#: #form.j_isr_request.subject#'
    - className: org.joget.apps.form.lib.CustomHTML
      properties:
        autoPopulate: ''
        id: field16_1
        label: Status
        value: |
          <span style="font-size:150%;">#form.j_isr_request.status#</span>
    - className: org.joget.apps.form.lib.CustomHTML
      properties:
        autoPopulate: ''
        id: field16_1
        label: Describe Issue
        value: |
          #form.j_isr_request.description#
    - className: org.joget.apps.form.lib.CustomHTML
      properties:
        autoPopulate: ''
        id: field16_2
        label: Priority
        value: |
          #form.j_isr_request.priority#
    - className: org.joget.apps.form.lib.CustomHTML
      properties:
        autoPopulate: ''
        id: field16_3
        label: Approver
        value: '#form.j_isr_request.attention#'
    className: org.joget.apps.form.model.Column
    properties:
      width: 49%
  - elements:
    - className: org.joget.apps.form.lib.CustomHTML
      properties:
        autoPopulate: ''
        id: field16_2
        label: Due Date
        value: '#form.j_isr_request.duedate#'
    - className: org.joget.apps.form.lib.CustomHTML
      properties:
        autoPopulate: ''
        id: field16_4
        label: Requested By
        value: '#form.j_isr_request.requester_name# (#form.j_isr_request.requester#)
          on #form.j_isr_request.createdDate#'
    - className: org.joget.apps.form.lib.CustomHTML
      properties:
        autoPopulate: ''
        id: field14
        label: Verified By
        value: '#form.j_isr_request.verifier# on #form.j_isr_request.dateVerified#'
    - className: org.joget.apps.form.lib.CustomHTML
      properties:
        autoPopulate: ''
        id: field16_3
        label: Department
        value: |
          #form.j_isr_request.department_name#
    className: org.joget.apps.form.model.Column
    properties:
      width: 49%
