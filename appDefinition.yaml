  - id: page_about_richText_en_US
    appId: isr
    appVersion: '5'
    messageKey: page_about_richText
    locale: en_US
    message: |-
      <h1>About</h1>
      <table width="100%" border="0" collapse="" align="center">
      <tbody>
      <tr>
      <td>
      <h1><span style="font-size: 18pt; color: #333333;">Internal Service Request App</span></h1>
      <p><strong><span style="font-size: 11pt; color: #000000;">Manage, Approve and Track Interdepartmental Requests</span></strong></p>
      </td>
      </tr>
      <tr>
      <td>
      <p>This is an Internal Service Request (ISR) app that allows users to make and manage inter-departmental service requests.</p>
      <p>Users will be able to make requests to specific head of department (HOD), who can then either resolve the request or assign the task to a subordinate for further action. This app also provides overall ISR reporting.&nbsp;</p>
      <p>The Internal Service Request app has been built to make use of the new features and capababilities of Joget DX Enterprise.</p>
      <p><strong>Tips to Joget administrator: </strong></p>
      <ul>
      <li>Input your Joget SMTP server configurations in <a href="#request.contextPath?html#/web/console/setting/general" target="_blank" rel="noopener">Web Console &gt; General Settings</a>&nbsp;to send email messages.</li>
      <li>Input an email address for admin user in <a href="#request.contextPath?html#/web/console/directory/users" target="_blank" rel="noopener">Web Console &gt; Setup Users</a>&nbsp;for email notification to work.</li>
      </ul>
      </td>
      </tr>
      </tbody>
      </table>
  - id: page_about_richText_zh_CN
    appId: isr
    appVersion: '5'
    messageKey: page_about_richText
    locale: zh_CN
    message: |2-

      <h1>
        内部协同应用
      </h1>
      <p>
        <strong>&nbsp;
        </strong>
      </p>
      <p>
        <strong>介绍
        </strong>
      </p>
      <p>内部协同应用是专为Joget DX Enterprise构建的。
      </p>
      <p>这个应用程序在表单、数据列表和用户界面中使用了Joget DX的许多新特性和功能。
      </p>
      <p>&nbsp;
      </p>
      <p>
        <strong>欢迎使用内部协同应用
        </strong>
      </p>
      <p>内部协同应用(ISR)让用户申请和管理跨部门的服务申请。
      </p>
      <p>用户可以向选定的部门负责人(HOD)发出申请，部门主管可以审批申请或将任务分配给下级以执行进一步操作。这个应用程序还提供全面的内部协作报表。
      </p>
      <p>
      </p>
      <p>
        <strong>给Joget管理员的提示:
        </strong>
      </p>
      <ul>
        </li>
        <li>在 <a href="#request.contextPath?html#/web/console/setting/general" target="_blank">系统设置 &gt; 常规设置
          </a> 中输入您的Joget SMTP服务器配置以发送电子邮件。
        </li>
        <li>在 <a href="#request.contextPath?html#/web/console/directory/users" target="_blank">系统设置 &gt; 设置用户
          </a> 中为管理员用户输入电子邮件地址，以使邮件通知生效。
        </li>
      </ul>
