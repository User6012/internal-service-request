      </p>\n<p>这是一个内部服务申请(ISR)应用程序，允许用户发出和管理跨部门的服务申请。\n</p>\n<p>用户可以向特定的部门主管(HOD)发\
      出申请，部门主管可以审批申请或将任务分配给下级以执行进一步操作。这个应用程序还提供全面的ISR报告。\n</p>\n<p>\n  <strong>给Joget管\
      理员的提示:\n  </strong>\n</p>\n<ul>\n  <li>设置 \n    <a href=\"#request.contextPath?html#/web/userview/expenseclaim/home/_/setupCategory\"\
      \ target=\"_blank\">费用类别\n    </a> (例如:娱乐、医疗、里程和收费等)。\n  </li>\n  <li>在 <a href=\"\
      #request.contextPath?html#/web/console/setting/general\" target=\"_blank\">系\
      统设置 &gt; 常规设置\n    </a> 中输入您的Joget SMTP服务器配置。\n  </li>\n  <li>在 <a href=\"#request.contextPath?html#/web/console/directory/users\"\
      \ target=\"_blank\">系统设置 &gt; 设置用户\n    </a> 中设置用户中为管理用户输入电子邮件地址，以便电子邮件通知工作\n\
      \  </li>\n</ul>"
