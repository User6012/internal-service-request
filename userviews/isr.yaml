        ac mauris sed pede pellentesque fermentum. Maecenas adipiscing ante non diam
        sodales hendrerit.</p>
      enableOffline: ''
      id: 5ECB552FB8AA48F2AE35980233EFE6D7
      label: <i class="fa fa-home" aria-hidden="true"></i> Welcome
      customId: home
      content: |-
        <h1></h1>
        <table width="90%" border="0" collapse="" align="center">
        <tbody>
        <tr>
        <td>
        <h1><span style="font-size: 24pt; color: rgb(51, 51, 51);">Welcome to the Internal Service Request App</span></h1>
        <p><span style="font-size: 14pt; color: #000000;">Manage, Approve and Track Interdepartmental Requests</span></p>
        </td>
        </tr>
        <tr>
        <td><img width="40%" src="#appResource.isrWelcomePage.png#"></td>
        </tr>
        <tr>
        <td>
        <p><br>This is an Internal Service Request (ISR) app that allows users to make and manage inter-departmental service requests.</p>
        <p>Users will be able to make requests to specific head of department (HOD), who can then either resolve the request or assign the task to a subordinate for further action. This app also provides overall ISR reporting.&nbsp;</p>
        <p>The Internal Service Request app has been built to make use of the new features and capababilities of Joget DX Enterprise.</p>
        <p><strong>Tips to Joget administrator: </strong></p>
        <ul>
        <li>Input your Joget SMTP server configurations in <a href="#request.contextPath?html#/web/console/setting/general" target="_blank" rel="noopener">Web Console &gt; General Settings</a>&nbsp;to send email messages.</li>
        <li>Input an email address for admin user in <a href="#request.contextPath?html#/web/console/directory/users" target="_blank" rel="noopener">Web Console &gt; Setup Users</a>&nbsp;for email notification to work.</li>
        </ul>
        </td>
        </tr>
        </tbody>
        </table>
